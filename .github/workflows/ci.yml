name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check every module
        run: python -m compileall -q src *.py

      - name: Unit tests (stdlib only)
        run: python -m unittest discover tests -v

      - name: Pipeline entry points import without a GPU stack
        # main() must be importable (and testable) without torch installed:
        # it imported dataset_generator at module scope, which made every unit
        # test of the loop pay a ~20s torch import.
        run: |
          PYTHONPATH=src python -c "import main; print('ok')"

      - name: Validate JSON data files
        run: |
          python - <<'EOF'
          import glob, json
          files = sorted(glob.glob("adapters/**/*.json", recursive=True)) + sorted(glob.glob("datasets/*.json"))
          assert files, "no JSON data files found"
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
              print(f"ok {path}")
          EOF

      - name: Pipeline entry points exist
        run: |
          test -f src/main.py
          test -f src/config.py
          test -f train.py
          test -f prompts/system_prompt.txt

      - name: Every src module imports without the GPU stack
        # Guards against a module-scope import of torch/transformers creeping
        # back in, which is what made the unit tests slow and CI-heavy.
        run: |
          PYTHONPATH=src python - <<'EOF'
          import importlib
          for name in ("config", "utils", "validator", "exporter",
                       "chapter_detector", "cleaner", "extract",
                       "semantic_chunker", "main"):
              importlib.import_module(name)
              print(f"ok {name}")
          EOF
